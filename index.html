<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- build:keep -->
  <title>Multi Timer</title>
  <meta name="claude:viewport-fit-sides" content="cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- /build:keep -->
</head>
<body>
  <!-- build:keep -->
  <header class="app-header">
    <div>
      <h1>Multi Timer</h1>
      <div id="summary" class="summary"></div>
    </div>
    <div class="header-actions">
      <button id="notify-btn" class="btn" hidden data-hint="Get a browser notification when a timer finishes while this tab is in the background">Enable notifications</button>
      <div class="segmented" role="group" aria-label="Layout">
        <button type="button" data-view="grid" aria-pressed="true" data-hint="Show timers as cards">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>
          Grid
        </button>
        <button type="button" data-view="list" aria-pressed="false" data-hint="Show timers as rows">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2" width="13" height="3" rx="1"/><rect x="1.5" y="6.5" width="13" height="3" rx="1"/><rect x="1.5" y="11" width="13" height="3" rx="1"/></svg>
          List
        </button>
      </div>
      <button id="zen-btn" type="button" class="btn switch-btn" role="switch" aria-checked="false" data-hint="Zen: show only names, times and progress">
        Zen <span class="track" aria-hidden="true"></span>
      </button>
      <button id="collapse-all" type="button" class="btn" data-hint="Hide or show the settings row on every timer">Hide settings</button>
      <button id="new-btn" class="btn primary" data-hint="Add a timer (shortcut: N)">+ New timer</button>
    </div>
  </header>

  <main>
    <p id="empty" class="empty" hidden>No timers yet. Press “+ New timer” or the N key to add one.</p>
    <ul id="timer-list" class="timer-list"></ul>
  </main>

  <template id="timer-template">
    <li class="timer-card">
      <button type="button" class="drag-handle" aria-label="Move timer (drag, or use arrow keys)" data-hint="Drag to reorder, or focus it and use the arrow keys"></button>
      <div class="card-top">
        <input class="name-input" data-field="name" type="text" maxlength="60" autocomplete="off" aria-label="Timer name" data-hint="Click to rename" />
        <button type="button" class="mute-btn" data-action="toggle-mute" aria-pressed="false" aria-label="Mute this timer" data-hint="Mute or unmute this timer. Muted timers still flash when they finish">
          <svg class="ico ico-sound" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5l3.5-3v10L5 10H2.5z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4"/></svg>
          <svg class="ico ico-muted" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5l3.5-3v10L5 10H2.5z"/><path d="M11 6l3.5 4M14.5 6L11 10"/></svg>
        </button>
        <span class="status"></span>
      </div>

      <div class="readout">
        <div class="timer-remaining"></div>
      </div>
      <div class="progress"><div class="progress-bar"></div></div>

      <div class="meta">
        <span class="when"></span>
        <span class="cycles" data-hint="How many times this timer has reached zero">
          <span class="cycles-count"></span>
          <button type="button" class="mini-btn" data-action="reset-cycles" aria-label="Reset cycle count" data-hint="Reset the cycle count to zero">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5v2.5h2.5"/></svg>
          </button>
        </span>
      </div>

      <div class="transport">
        <button type="button" class="btn primary" data-role="primary"></button>
        <button type="button" class="btn" data-role="secondary"></button>
        <button type="button" class="btn snooze-btn" data-action="snooze" aria-pressed="false" data-hint="Snooze: let this run finish silently, then start over. The next finish alerts as usual">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.5 4.5 0 0 0 6.5 6.5z"/></svg>
          <span class="label">Snooze</span>
        </button>
        <span class="spacer"></span>
        <button type="button" class="btn quiet edit-toggle" data-action="toggle-panel" aria-expanded="true" aria-label="Settings" data-hint="Show or hide this timer's settings"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M12 4h2M2 12h2M7 12h7"/><circle cx="10.5" cy="4" r="1.5"/><circle cx="5.5" cy="12" r="1.5"/></svg></button>
        <button type="button" class="btn quiet danger icon-btn" data-action="delete" aria-label="Delete timer" data-hint="Delete this timer (asks you to confirm)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5"/></svg></button>
        <span class="confirm" hidden>
          <button type="button" class="btn danger-solid" data-action="confirm-delete">Delete this timer</button>
          <button type="button" class="btn quiet" data-action="cancel-delete">Keep</button>
        </span>
      </div>

      <div class="chips" data-role="panel">
        <label class="chip length-chip" data-hint="Length: type it, or use ↑/↓ or the scroll wheel (Shift for bigger steps)">
          <input data-field="hours" type="number" min="0" max="99" step="1" inputmode="numeric" aria-label="Length, hours" /><span class="u">h</span>
          <input data-field="minutes" type="number" min="0" max="59" step="1" inputmode="numeric" aria-label="Length, minutes" /><span class="u">m</span>
          <input data-field="seconds" type="number" min="0" max="59" step="1" inputmode="numeric" aria-label="Length, seconds" /><span class="u">s</span>
        </label>
        <label class="chip sound-chip" data-hint="Sound played when the timer reaches zero">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 12.5V3.5l7-1.5v9"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="11" r="1.5"/></svg>
          <select data-field="sound" aria-label="Sound"></select>
        </label>
        <button type="button" class="chip switch-chip" data-action="toggle-repeat" role="switch" aria-checked="false" data-hint="Repeat: start the next cycle automatically">
          Repeat <span class="track" aria-hidden="true"></span>
        </button>
        <button type="button" class="chip switch-chip" data-action="toggle-nudge" role="switch" aria-checked="false" data-hint="Nudge on: ring until you dismiss it. Off: ring 3 times, then restart (Repeat) or wait">
          Nudge <span class="track" aria-hidden="true"></span>
        </button>
      </div>

      <p class="hint" aria-hidden="true"></p>
    </li>
  </template>

  <script type="module" src="js/main.js"></script>
  <!-- /build:keep -->
</body>
</html>
